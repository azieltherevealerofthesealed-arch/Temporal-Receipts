<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Temporal Receipts</title>

<style>
  body {
    font-family: monospace;
    background: #0b0b0b;
    color: #e6e6e6;
    padding: 20px;
  }
  h1 { margin-bottom: 10px; }
  input, button {
    margin: 6px 0;
    padding: 6px;
    background: #111;
    color: #e6e6e6;
    border: 1px solid #333;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
  }
  th, td {
    border: 1px solid #333;
    padding: 6px;
    font-size: 12px;
  }
  th { background: #111; }
  tr:hover { background: #1a1a1a; cursor: pointer; }
  pre {
    background: #111;
    padding: 10px;
    border: 1px solid #333;
    overflow-x: auto;
  }
</style>
</head>

<body>

<h1>Temporal Receipts</h1>

<input type="file" id="fileInput" />
<br/>
<input type="text" id="search" placeholder="search receipts…" />
<button onclick="exportLedger()">export ledger</button>
<button onclick="clearLedger()">clear</button>

<h3>Latest Receipt</h3>
<pre id="latest">(none)</pre>

<h3>Receipt Ledger</h3>
<table>
<thead>
<tr>
  <th>time</th>
  <th>filename</th>
  <th>sha256</th>
</tr>
</thead>
<tbody id="ledger"></tbody>
</table>

<script>
const LEDGER_KEY = "temporal_receipts_ledger";
let ledger = JSON.parse(localStorage.getItem(LEDGER_KEY) || "[]");

function saveLedger() {
  localStorage.setItem(LEDGER_KEY, JSON.stringify(ledger));
}

async function sha256(file) {
  const buf = await file.arrayBuffer();
  const hashBuf = await crypto.subtle.digest("SHA-256", buf);
  return [...new Uint8Array(hashBuf)]
    .map(b => b.toString(16).padStart(2,"0"))
    .join("");
}

function render(filter="") {
  const tbody = document.getElementById("ledger");
  tbody.innerHTML = "";
  ledger
    .filter(r =>
      JSON.stringify(r).toLowerCase().includes(filter.toLowerCase())
    )
    .forEach(r => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${r.timestamp}</td>
        <td>${r.filename}</td>
        <td>${r.sha256.slice(0,16)}…</td>
      `;
      tr.onclick = () =>
        document.getElementById("latest").textContent =
          JSON.stringify(r, null, 2);
      tbody.appendChild(tr);
    });
}

document.getElementById("fileInput").addEventListener("change", async e => {
  const file = e.target.files[0];
  if (!file) return;

  const hash = await sha256(file);
  const receipt = {
    receipt_id: `TR-${Date.now()}-${hash.slice(0,8)}`,
    filename: file.name,
    mime: file.type || "unknown",
    size_bytes: file.size,
    sha256: hash,
    timestamp: new Date().toISOString()
  };

  ledger.unshift(receipt);
  saveLedger();
  render();
  document.getElementById("latest").textContent =
    JSON.stringify(receipt, null, 2);

  // auto-download receipt
  const blob = new Blob(
    [JSON.stringify(receipt, null, 2)],
    {type:"application/json"}
  );
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = file.name + ".receipt.json";
  a.click();
});

document.getElementById("search").addEventListener("input", e =>
  render(e.target.value)
);

function exportLedger() {
  const blob = new Blob(
    [JSON.stringify(ledger, null, 2)],
    {type:"application/json"}
  );
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "temporal-receipts-ledger.json";
  a.click();
}

function clearLedger() {
  if (!confirm("clear all receipts?")) return;
  ledger = [];
  saveLedger();
  render();
  document.getElementById("latest").textContent = "(none)";
}

render();
</script>

</body>
</html>
